    border-radius: 8px;
    cursor: pointer;
}

.movie-card .card-overlay .tags {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 8px;
    width: 100%;
    align-items: center;
}

.movie-card .card-overlay .tags span {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 4px 2px;
    border-radius: 4px;
    background-color: rgba(255, 255, 255, 0.2);
    color: #ffffff;
    backdrop-filter: blur(4px);
    text-align: center;
    white-space: nowrap;
}

.movie-card .card-overlay .tags span:first-child {
    grid-column: 1 / -1;
    justify-self: center;
    padding: 4px 12px;
    background-color: #a8252a;
    font-weight: 700;
    font-size: 0.8rem;
}

.movie-card .card-overlay .info {
    display: flex;
    align-items: center;
}

.movie-card .card-overlay .info span:first-child {
    display: none;
}

.movie-card .card-overlay .info span:last-child {
    font-size: 1.1rem;
    font-weight: 800;
    color: #ffd700;
    display: flex;
    align-items: center;
    gap: 6px;
}

.movie-card .card-overlay .info i {
    font-size: 1.05rem;
}

.movie-card .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom,
            rgba(0, 0, 0, 0.85) 0%,
            rgba(0, 0, 0, 0.4) 40%,
            rgba(0, 0, 0, 0.95) 100%);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px;
    opacity: 0;
    transition: opacity 0.3s ease;
    box-sizing: border-box;
}

.movie-card .card-overlay h3 {
    font-size: 1.25rem;
    font-weight: 800;
    color: #ffffff;
    margin: 0;
    line-height: 1.3;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
}

.movie-card:hover .card-overlay {
    opacity: 1;
}

.movie-card:hover img {
    transform: scale(1.05);
}

.movie-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
}

.card-overlay h3 {
    font-size: 14px;
    margin-bottom: 5px;
}

.card-overlay .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    margin-bottom: 5px;
}

.card-overlay .tags span {
    background: rgba(255, 255, 255, 0.2);
    font-size: 8px;
    padding: 2px 4px;
    border-radius: 2px;
}

.card-overlay .info {
    font-size: 10px;
    display: flex;
    justify-content: space-between;
    color: #ccc;
}

/* ==================== Menu lateral expansível e overlay ==================== */
.sidebar a span {
    display: none;
    white-space: nowrap;
    font-size: 14px;
    font-weight: 500;
}

.sidebar a i {
    min-width: 20px;
    text-align: center;
}

.sidebar.expanded {
    width: 220px;
}

.sidebar.expanded a span {
    display: inline;
}

.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(2px);
    z-index: 999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

.overlay.active {
    opacity: 1;
    visibility: visible;
}

/* ==================== Modal de configurações ==================== */
.settings-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(3px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

.settings-overlay.active {
    opacity: 1;
    visibility: visible;
}

.settings-container {
    width: 75%;
    height: 75%;
    background: linear-gradient(#A22424, #010101 75%);
    border: 1.5px solid #fff;
    border-radius: 20px;
    display: flex;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
}

.settings-sidebar {
    width: 200px;
    border-right: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    flex-direction: column;
    padding: 30px 15px;
    gap: 15px;
}

.settings-tab {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    text-align: left;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 20px;
    transition: all 0.2s;
}

.settings-tab.active {
    background: rgba(255, 255, 255, 0.2);
}

.settings-tab.btn-sair {
    color: #ff4d4d;
    margin-top: auto;
}

.settings-content {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
}

.settings-header h2 {
    font-size: 28px;
    font-weight: 800;
    color: #fff;
}

.close-modal-btn {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
}

.settings-body {
    display: flex;
    padding: 30px;
    gap: 40px;
    flex: 1;
}

.settings-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.info-group {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
}

.info-group label {
    font-weight: 800;
    color: #fff;
    min-width: 150px;
}

.info-group span {
    color: #ddd;
    display: flex;
    align-items: center;
    gap: 8px;
}

.toggle-icon {
    cursor: pointer;
    font-size: 14px;
    opacity: 0.8;
}

.theme-toggle {
    display: inline-flex;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;

}

.theme-toggle span {
    padding: 4px 12px;
    border-radius: 12px;

}

.theme-toggle span.active {
    background: rgba(255, 255, 255, 0.3);

/* ==================== Plataformas ==================== */
.section-title {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 18px;
    color: #ffffff;
}

.platforms-section {

}

.platforms-row {

    flex-wrap: wrap;
    gap: 16px;
    justify-content: space-between;
}

.platform-badge {

    align-items: center;

    letter-spacing: 0.5px;
    color: #fff;
    padding: 0 20px;

}

.platform-badge.disney {

}

.platform-badge.netflix {

.platform-badge.hbomax {

}

.platform-badge.hbomax span {

}

.platform-badge.globoplay {

/* ==================== Planos ==================== */
.plans-section {
    margin: 40px 0;
}

.plans-grid {
    display: flex;
    gap: 22px;
    overflow-x: auto;
    padding-bottom: 10px;
    scroll-behavior: smooth;

}

.plans-grid::-webkit-scrollbar {
    display: none;
}

.plan-card {

    flex: 0 0 300px;
    background-color: rgba(20, 5, 5, 0.8);

    transition: outline-color 0.2s, transform 0.2s;

}

.plan-card.selecionado {

}

.plan-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    background-color: #d4af37;

    font-weight: 800;
    padding: 4px 8px;
    border-radius: 4px;

}

.plan-tier {

}

.plan-price {

    font-weight: 800;

    color: #fff;
}

.plan-price span {
    font-size: 0.9rem;
    font-weight: 400;
    color: #9a9a9a;
}

.plan-features {

    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
    flex: 1;
}

.plan-features li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: #ddd;
}

.plan-features li i {

    font-size: 0.8rem;
}

.plan-btn {

    border-radius: 6px;

    font-weight: 600;

    transition: filter 0.2s;
}

.plan-btn:hover {

.plan-btn--bronze {

}

.plan-btn--ouro {

}

.plan-btn--prata {

/* ==================== Dropdown do avatar ==================== */
.user-avatar {
    cursor: pointer;
}

.user-dropdown {
    position: fixed;
    top: 60px;
    /* Distância do topo da tela */
    right: 20px;
    /* Distância da borda direita da tela */
    width: 280px;
    background-color: #2a2a2a;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    z-index: 99999;

.user-dropdown.active {
    display: block !important;
}

.dropdown-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 12px;
}

.dropdown-avatar {

    height: 30px;
    border-radius: 50%;

}

.dropdown-header span {
    color: #fff;

}

.dropdown-body {

    gap: 12px;
}

.dropdown-col {
    display: flex;
    flex-direction: column;
    gap: 10px;

}

.dropdown-col a {
    color: #ccc;
    text-decoration: none;
    font-size: 0.8rem;
    transition: color 0.2s;
}

.dropdown-col a:hover {
    color: #fff;
}

.dropdown-col .logout-link {

}

.dropdown-divider {
    width: 1px;
    background-color: rgba(255, 255, 255, 0.1);
}

.movie-page {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 28px;
    align-items: start;
}

/* ---------- Trailer ---------- */
.trailer {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
    background-color: #1a1a1a;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}


.trailer iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    object-fit: cover;
    display: block;
}

.trailer-play {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 76px;
    height: 76px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(3px);
    color: #fff;
    font-size: 1.9rem;
    display: grid;
    place-items: center;
    padding-left: 5px;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
}

.trailer:hover .trailer-play {
    background: rgba(255, 255, 255, 0.55);
    transform: translate(-50%, -50%) scale(1.06);
}

.trailer-yt {
    position: absolute;
    right: 18px;
    bottom: 16px;
    width: 42px;
    height: 30px;
    border-radius: 8px;
    background: #e11d1d;
    color: #fff;
    font-size: 0.8rem;
    display: grid;
    place-items: center;
    pointer-events: none;
}

.trailer.playing .trailer-play,
.trailer.playing .trailer-yt {
    display: none;
}

/* ---------- Título e informações ---------- */
.movie-title {
    font-size: 2.75rem;
    font-weight: 800;
    line-height: 1.1;
    margin-top: 24px;
}

.movie-meta {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 16px;
    font-weight: 700;
    font-size: 1rem;
}

.class-indicativa {
    width: 32px;
    height: 32px;
}

.meta-sep {
    width: 2px;
    height: 20px;
    background: #fff;
}

.movie-genres {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
}

.movie-genres a {
    background-color: #8b8480;
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 3px 12px;
    border-radius: 4px;
    text-decoration: none;
    transition: background-color 0.2s;
}

.movie-genres a:hover {
    background-color: #a39d99;
}

/* ---------- Coluna lateral ---------- */
.movie-aside {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.score-card {
    background-color: #36322f;
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
}

.score-card>i {

}

.score-value {

.score-count {

.related-card {

.related-card h3 {

.related-item:hover {

}

.related-item img {

.related-item h4 {

/* ---------- Responsivo ---------- */

    width: 100%;

<script>
var FA_CSS = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
var TITLES = {
  'pag-home': 'Pipoquetas',
  'pag-explore': 'Pipoquetas - Explore',
  'pag-duna2': 'Duna 2',
  'pag-interstellar': 'Interstellar',
  'pag-blade': 'Blade Runner 2049',
  'pag-matrix': 'Matrix Resurrections'
};
var FILME_IDS = ['pag-duna2', 'pag-interstellar', 'pag-blade', 'pag-matrix'];
var roots = {};

function norm(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
var MAP_FILME = {
  'duna - parte 2': 'pag-duna2',
  'duna 2 - o filme': 'pag-duna2',
  'interestelar': 'pag-interstellar',
  'interstellar': 'pag-interstellar',
  'blade runner 2049': 'pag-blade',
  'matrix resurrections': 'pag-matrix'
};

function showPage(id, push) {
  if (!document.getElementById(id)) id = 'pag-home';
  document.querySelectorAll('.pagina').forEach(function (h) { h.classList.remove('ativa'); });
  document.getElementById(id).classList.add('ativa');
  document.title = TITLES[id] || 'Pipoquetas';
  if (push !== false && location.hash !== '#/' + id) location.hash = '#/' + id;
  window.scrollTo(0, 0);
}

/* comportamento original de cada página, com buscas restritas à própria página */
function initCommon(shadow) {
  var dropbtn = shadow.querySelector('#dropbtn') || shadow.querySelector('#menuToggle');
  var sidebar = shadow.querySelector('#sidebar') || shadow.querySelector('.sidebar');
  var overlay = shadow.querySelector('#sidebarOverlay');
  if (dropbtn && sidebar) {
    dropbtn.addEventListener('click', function () {
      sidebar.classList.toggle('expanded');
      if (overlay) overlay.classList.toggle('active');
    });
    if (overlay) overlay.addEventListener('click', function () {
      sidebar.classList.remove('expanded');
      overlay.classList.remove('active');
    });
  }
  var modal = shadow.querySelector('#settingsModal');
  if (modal) {
    var closeBtn = shadow.querySelector('#closeSettingsBtn');
    var open = function (e) {
      if (e) e.preventDefault();
      modal.classList.add('active');
      if (sidebar) sidebar.classList.remove('expanded');
      if (overlay) overlay.classList.remove('active');
    };
    shadow.querySelectorAll('.sidebar a').forEach(function (link) {
      if (link.textContent.indexOf('Configurações') > -1) link.addEventListener('click', open);
    });
    if (closeBtn) closeBtn.addEventListener('click', function () { modal.classList.remove('active'); });
    modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.remove('active'); });
  }
  var avatarBtn = shadow.querySelector('#avatarBtn');
  var userDropdown = shadow.querySelector('#userDropdown');
  if (avatarBtn && userDropdown) {
    avatarBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      userDropdown.classList.toggle('active');
    });
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (shadow.contains(t) && !userDropdown.contains(t) && !avatarBtn.contains(t)) userDropdown.classList.remove('active');
      else if (!shadow.contains(t) && t !== document.body) userDropdown.classList.remove('active');
    });
  }
}

function initHome(shadow) {
  var slides = shadow.querySelectorAll('#heroSlideshow .hero-slide');
  if (slides.length > 1) {
    var idx = 0;
    setInterval(function () {
      slides[idx].classList.remove('active');
      idx = (idx + 1) % slides.length;
      slides[idx].classList.add('active');
    }, 10000);
  }
  var cont = shadow.querySelector('#categoriesContainer');
  var prev = shadow.querySelector('#prevCatBtn');
  var next = shadow.querySelector('#nextCatBtn');
  if (cont && prev && next) {
    var update = function () {
      var max = cont.scrollWidth - cont.clientWidth;
      prev.classList.toggle('hidden', cont.scrollLeft <= 5);
      next.classList.toggle('hidden', cont.scrollLeft >= max - 5);
    };
    next.addEventListener('click', function () { cont.scrollBy({ left: 250, behavior: 'smooth' }); });
    prev.addEventListener('click', function () { cont.scrollBy({ left: -250, behavior: 'smooth' }); });
    cont.addEventListener('scroll', update);
    window.addEventListener('resize', update);
    update();
  }
  var pairs = [['moviesGrid', 'prevMovieBtn', 'nextMovieBtn'], ['moviesGrid2', 'prevMovieBtn2', 'nextMovieBtn2']];
  pairs.forEach(function (ids) {
    var grid = shadow.getElementById ? shadow.getElementById(ids[0]) : shadow.querySelector('#' + ids[0]);
    var p = shadow.querySelector('#' + ids[1]);
    var n = shadow.querySelector('#' + ids[2]);
    if (grid && p && n) {
      p.addEventListener('click', function () { grid.scrollBy({ left: -300, behavior: 'smooth' }); });
      n.addEventListener('click', function () { grid.scrollBy({ left: 300, behavior: 'smooth' }); });
    }
  });
  /* clique nos filmes -> página de detalhe correspondente */
  shadow.querySelectorAll('.movie-card').forEach(function (card) {
    var h3 = card.querySelector('.card-overlay h3, h3');
    var dest = MAP_FILME[norm(h3 && h3.textContent)];
    if (dest) {
      card.style.cursor = 'pointer';
      card.addEventListener('click', function () { showPage(dest); });
    }
  });
}

function initTrailer(pageId) {
  var shadow = roots[pageId];
  var trailer = shadow.querySelector('#trailer');
  if (!trailer || !trailer.getAttribute('data-video-id')) return;
  var titleEl = shadow.querySelector('.movie-title');
  var title = titleEl ? titleEl.textContent.trim() : 'filme';
  trailer.addEventListener('click', function () {
    if (trailer.classList.contains('playing')) return;
    var id = trailer.getAttribute('data-video-id');
    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/' + id + '?autoplay=1&rel=0';
    iframe.title = 'Trailer de ' + title;
    iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    trailer.classList.add('playing');
    trailer.replaceChildren(iframe);
  });
  /* relacionados -> navegam entre as páginas de filme */
  shadow.querySelectorAll('.related-item').forEach(function (a) {
    var h4 = a.querySelector('h4');
    var dest = MAP_FILME[norm(h4 && h4.textContent)];
    if (dest) {
      a.style.cursor = 'pointer';
      a.addEventListener('click', function (e) { e.preventDefault(); showPage(dest); });
    }
  });
}

/* navegação geral: Início/Menu inicial -> home, Explore -> explore, logos -> home */
function initNav(shadow) {
  shadow.querySelectorAll('a').forEach(function (a) {
    var t = (a.textContent || '').trim();
    if (t === 'Início' || t === 'Menu inicial') {
      a.addEventListener('click', function (e) { e.preventDefault(); showPage('pag-home'); });
    } else if (t === 'Explore') {
      a.addEventListener('click', function (e) { e.preventDefault(); showPage('pag-explore'); });
    }
  });
  var logo = shadow.querySelector('h1.logo');
  if (logo) { logo.style.cursor = 'pointer'; logo.addEventListener('click', function () { showPage('pag-home'); }); }
  var brand = shadow.querySelector('.brand-name');
  if (brand) { brand.style.cursor = 'pointer'; brand.addEventListener('click', function () { showPage('pag-explore'); }); }
}

['home', 'explore', 'duna2', 'interstellar', 'blade', 'matrix'].forEach(function (key) {
  var id = 'pag-' + key;
  var host = document.getElementById(id);
  var shadow = host.attachShadow({ mode: 'open' });
  shadow.appendChild(document.getElementById('css-' + key).content.cloneNode(true));
  shadow.appendChild(document.getElementById('tpl-' + key).content.cloneNode(true));
  roots[id] = shadow;
  initCommon(shadow);
  initNav(shadow);
});
initHome(roots['pag-home']);
FILME_IDS.forEach(initTrailer);

window.addEventListener('hashchange', function () {
  var id = (location.hash || '').replace('#/', '');
  if (id.indexOf('pag-') === 0 && document.getElementById(id)) showPage(id, false);
});
var first = (location.hash || '').replace('#/', '');
showPage(document.getElementById(first) && first.indexOf('pag-') === 0 ? first : 'pag-home', false);
if (!location.hash) location.hash = '#/pag-home';

</script>
