<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipoquetas - Entrar</title>
  <!-- Ícones Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Estilo da tela de login -->
  <link rel="stylesheet" href="css/PipoquetasLogin.css" />
</head>
<body>

  <!-- CABEÇALHO DA MARCA -->
  <header>
    <div class="logo">PIPOQUETAS</div>
  </header>

  <!-- CARD PRINCIPAL DE LOGIN -->
  <main class="login-container">
    <div class="login-card">
      <h1 class="login-title">Iniciar Sessão</h1>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail ou Usuário</label>
          <input type="text" id="email" class="form-input" placeholder="seuemail@exemplo.com" required />
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required />
            <i class="fa-regular fa-eye toggle-password" id="togglePassword" title="Mostrar/Ocultar senha"></i>
          </div>
        </div>

        <div class="form-options">
          <a href="#" class="forgot-password">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-login">Entrar</button>
        <div id="mensagem" style="margin-top:16px; text-align:center; color:#ff6b6b; font-weight:600; font-size:0.9rem;"></div>
      </form>

      <div class="login-footer">
        <p>Novo por aqui? <a href="#">Cadastre-se agora</a>.</p>
      </div>
    </div>
  </main>

  <script src="js/PipoquetasLogin.js" defer></script>

</body>
</html>
